name: Shared Lists full ELF delivery
on:
  pull_request:
    paths: ['scripts/*lists*', 'tests/test_shared_lists.py', 'docs/LISTS_SHARED_DELIVERY.md', '.github/workflows/shared-lists.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  products:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: db47bebca498e1eb44559fdbf69002b935f42dac
          path: .deps/System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 0052d1fc42e9cfc82d626c5a247d460919c87935
          path: .deps/Runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 6a3b3d46f5b2857eacc6e9863799dec1f466b036
          path: .deps/X4Runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ab9ff33975680c5bb8d9a2e7ed346d0300732a4e
          path: .deps/Bootfs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyelftools==0.32
      - name: Retrieve immutable original product inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/inputs qualification/logs
          gh api repos/michaelrolphone-cmyk/RiscRTE-T-Watch-S3/actions/artifacts/13066458995/zip > qualification/inputs/watch.zip
          gh api repos/michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06/actions/artifacts/13062911920/zip > qualification/inputs/wave.zip
          gh api -H 'Accept: application/octet-stream' repos/michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO/releases/assets/648840942 > qualification/inputs/x4-store.bin
          gh api -H 'Accept: application/octet-stream' repos/michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO/releases/assets/648840698 > qualification/inputs/x4-sd.zip
      - name: Canonical full ELF and lossless product projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_shared_lists.py --inputs qualification/inputs --bootfs-tools .deps/Bootfs/scripts --output qualification/products 2>&1 | tee qualification/logs/products.log
          python scripts/package_shared_lists.py --inputs qualification/inputs --bootfs-tools .deps/Bootfs/scripts --output qualification/repeat 2>&1 | tee qualification/logs/repeat.log
          cmp qualification/products/receipt.json qualification/repeat/receipt.json
          cmp qualification/products/lists.elf qualification/repeat/lists.elf
          for lane in watch wave x4; do
            cmp qualification/products/$lane/store.bin qualification/repeat/$lane/store.bin
          done
          python -m unittest discover -s tests -p test_shared_lists.py -v 2>&1 | tee qualification/logs/regressions.log
      - name: Complete product native Runtime and ELF admission
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal sanitized; do
            flags=(); if [ "$mode" = sanitized ]; then flags=(--sanitize); fi
            python .deps/System/scripts/test_files_product_admission.py --runtime .deps/Runtime --x4-runtime .deps/X4Runtime --assembly qualification/products --source-pins .deps/System/docs/files-product-runtime-source-pins.json --output "qualification/admission-$mode" "${flags[@]}" 2>&1 | tee "qualification/logs/admission-$mode.log"
          done
      - name: Preserve source and identity
        if: always()
        run: |
          mkdir -p qualification/source
          git rev-parse HEAD > qualification/source/productivity.head
          git archive HEAD | gzip -n > qualification/source/productivity.tar.gz
          for source in System Runtime X4Runtime Bootfs; do
            git -C ".deps/$source" rev-parse HEAD > "qualification/source/$source.head"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-lists-products-${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
