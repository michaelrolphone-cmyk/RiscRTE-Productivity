name: Publish Reader chapter-link source
on:
  push:
    branches: [feat/reader-nova7-gui]
    paths: [.github/workflows/reader-links-source.yml]
permissions:
  contents: read
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code e736edd7923fe0eb7e0ea4ce2844944398c8649c HEAD -- reader Apps productivity-manifest.json test scripts
          python3 - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          encoded=''.join(Path(f'.reader-links/{i:02}.txt').read_text().strip() for i in (1,2))
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='1e3f55de970a7c90386dc097980f104be4064a3f7960e0b503afd85e296f9fdc'
          Path('/tmp/links.patch').write_bytes(patch)
          PY
          git apply --check /tmp/links.patch
          git apply --index /tmp/links.patch
          git rm .reader-links/*.txt
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Enable EPUB links and incremental chapter anchors without losing warm page turns (Reader 0.1.8)'
          git push origin HEAD:feat/reader-nova7-gui
