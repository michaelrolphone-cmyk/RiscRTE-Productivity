name: Timecard shared scene
on:
  pull_request:
  push:
    branches: [main, tasker/timecard-shared-scenes-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timecard:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 7270a10ed9cefba6ec1368060196a13bb3370985
          path: .deps/system
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 13eca114cb58469cf6004fafc3da84fbd9d29beb
          path: .deps/runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Models, faults, native rendering and reproducible ELF
        run: |
          python scripts/timecard_scene.py --runtime .deps/runtime --system-apps .deps/system --build --frames dist/timecard-frames
      - uses: actions/upload-artifact@v4
        with:
          name: timecard-shared-${{ github.sha }}
          path: |
            dist/timecard-scene/
            dist/timecard-frames/
          if-no-files-found: error
          retention-days: 14

      - name: Publish exact shared-app prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/tasker/timecard-shared-scenes-20261104'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('dist/timecard-scene/timecard')
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          Path('dist/release-manifest.json').write_text(json.dumps({
            'application':'timecard','version':'0.3.1','source_commit':os.environ['SOURCE_SHA'],
            'files':files,'software_tests':'passed','physical_testing':'not performed',
            'product_integration':'Exact existing app-data/settings bindings and product cohort qualification remain required.'
          },indent=2)+'\n')
          PY
          git archive --format=zip -o dist/source.zip HEAD
          tar -czf dist/timecard-qualification.tar.gz dist/timecard-frames dist/timecard-scene
          gh release create "timecard-shared-$SOURCE_SHA" \
            dist/timecard-scene/timecard/timecard.elf \
            dist/timecard-scene/timecard/timecard.json \
            dist/timecard-scene/timecard/build.json \
            dist/release-manifest.json dist/source.zip dist/timecard-qualification.tar.gz \
            --target "$SOURCE_SHA" --prerelease --title "Shared Timecard 0.3.1" \
            --notes "One byte-identical Timecard app with shared native-resolution scenes. Model, storage/custody, sanitizer, native-rendering and target-ELF checks passed. Product boot-store integration and physical testing are not claimed."
