name: Timecard portable UI and model
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: dbd358746bc8f1254619ca42073e1d44f6ad45df
          path: .deps/system-apps
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 1d9bcb204a0b12ac6483511f32ba56da47699404
          path: .deps/runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original model and portable validation, interaction and real-renderer tests
        run: |
          python scripts/test_timecard_portable.py --system-apps .deps/system-apps --runtime-appdata .deps/runtime
          bash scripts/test_timecard_app_data.sh .deps/runtime
      - name: Preserve migration and original app inventory
        run: python -m unittest discover -s tests -v
      - name: Install exact public target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Validate default UI, app-data client and exact-dependency integration package
        run: |
          python scripts/build_timecard_portable.py --system-apps .deps/system-apps
          python scripts/build_timecard_portable.py --system-apps .deps/system-apps --app-data-client --alarm-client --navigation --denver
          python scripts/build_timecard_portable.py --system-apps .deps/system-apps --runtime-appdata .deps/runtime --package-profile --denver
      - uses: actions/upload-artifact@v4
        with:
          name: timecard-ui-development-${{ github.sha }}
          path: |
            dist/timecard-ui-development/
            dist/timecard-appdata-development/
            dist/timecard-portable/
            build/timecard-portable/profile-frames-0/
            build/timecard-portable/adapter-frames-0/
          if-no-files-found: error
          retention-days: 14
