name: Timecard shared input
on:
  push:
    branches: [work/timecard-shared-input-20261012]
  pull_request:
    paths:
      - 'Apps/timecard*'
      - 'test/native_apps/timecard*'
      - 'scripts/test_timecard_shared_input.py'
      - '.github/workflows/timecard-shared-input.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 7fb13b09b4dac275a8111b224784f8a472f39264
          path: .dependencies/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 4beb9778d300ec9f6b18448e1ec86317e063c98c
          path: .dependencies/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 1c1ed8661ea30d47e7e9707c41d492ce3a2b4d70
          path: .dependencies/runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normal and ASan/UBSan with platform-default leak detection
        run: >-
          python scripts/test_timecard_shared_input.py
          --system-apps .dependencies/system
          --utilities .dependencies/utilities
          --runtime .dependencies/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timecard-shared-input-evidence
          path: build/timecard-shared-input/test-evidence.json
