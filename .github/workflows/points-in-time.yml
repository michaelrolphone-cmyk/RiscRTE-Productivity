name: Points in Time development build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  points-in-time:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 47208f387f5d080e065f7c919ef0d0bdd4830663
          path: .deps/system-apps
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: d7ffcb57e54afcf4267701ea7d3cbc83651b34b3
          path: .deps/utilities
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify new inventory and preserve Reader migration baselines
        run: python -m unittest discover -s tests -v
      - name: Test Points NOVA-7 UI, keyboard, storage uncertainty and cue controls
        run: python scripts/test_points_in_time.py --system-apps .deps/system-apps --utilities .deps/utilities
      - name: Test real glyph pixels, touch ownership, clipping and continuous scrolling
        run: |
          python scripts/test_points_picker.py --system-apps .deps/system-apps --utilities .deps/utilities
          python scripts/test_points_gui.py --system-apps .deps/system-apps --utilities .deps/utilities
          python scripts/test_points_paper.py --system-apps .deps/system-apps --utilities .deps/utilities
          python scripts/test_points_touch.py --system-apps .deps/system-apps --utilities .deps/utilities
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build development ELF with exact shared dependencies
        run: |
          python scripts/build_points_in_time.py --system-apps .deps/system-apps --utilities .deps/utilities
          python scripts/build_points_in_time.py --system-apps .deps/system-apps --utilities .deps/utilities --display-rotation 90 --navigation --partial-damage --return-app springboard.elf --output-dir dist/points-paper
      - uses: actions/upload-artifact@v4
        with:
          name: points-in-time-development-${{ github.sha }}
          path: |
            dist/points-in-time/
            dist/points-paper/
            build/points-paper/frames/
          if-no-files-found: error
          retention-days: 14
